[package]
name = "napi-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "napi-rs bindings exposing astro-core to Electron"

[lib]
crate-type = ["cdylib"]

[dependencies]
astro-core = { path = "../astro-core" }
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
napi-build = "2"
