[package]
name = "astro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core astrophotography image processing library for astro-viber"

[dependencies]
byteorder = "1"
image = { version = "0.25", features = ["png", "tiff"] }
nalgebra = "0.33"
rayon = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"
